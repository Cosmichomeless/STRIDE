name: STRIDE
options:
  bundleIdPrefix: com.cosmichomeless
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  STRIDE:
    type: application
    platform: iOS
    sources:
      - path: STRIDE
    info:
      path: STRIDE/Info.plist
      properties:
        # Required for allowsBackgroundLocationUpdates; without it CoreLocation raises an exception.
        UIBackgroundModes: [location]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cosmichomeless.stride
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "STRIDE uses your location to record the route, distance and pace of your runs."
  STRIDETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: STRIDETests
    dependencies:
      - target: STRIDE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cosmichomeless.stride.tests
  STRIDEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: STRIDEUITests
    dependencies:
      - target: STRIDE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cosmichomeless.stride.uitests
schemes:
  STRIDE:
    build:
      targets:
        STRIDE: all
    test:
      targets:
        - STRIDETests
  # Separate on purpose: the walkthrough takes ~2.5 minutes and is not a regression test.
  STRIDEScreenshots:
    build:
      targets:
        STRIDE: all
    test:
      targets:
        - STRIDEUITests
